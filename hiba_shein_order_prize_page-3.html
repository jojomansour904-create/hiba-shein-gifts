<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اكتشفي جائزتك</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:Arial,Tahoma,sans-serif;
  background:linear-gradient(135deg,#071a3d,#152d5c);
  color:#fff; padding:20px;
}
.card{
  width:min(92vw,430px); background:#fffaf0; color:#101b38;
  border-radius:24px; padding:34px 24px; text-align:center;
  box-shadow:0 18px 50px #0006;
}
h1{margin:0 0 12px;font-size:30px;color:#7d1834}
p{font-size:18px;margin:0 0 24px}
button{
  border:0; border-radius:14px; padding:15px 24px; font-size:18px;
  font-weight:bold; cursor:pointer; width:100%; margin-top:10px;
}
#reveal{background:#7d1834;color:white}
#instagram{background:#101b38;color:white;display:none}
#prize{
  display:none; margin:22px 0 8px; padding:22px 15px;
  border:2px solid #c7a44b; border-radius:18px;
  background:#fff; font-size:21px; font-weight:bold; line-height:1.6;
}
.small{font-size:13px;color:#666;margin-top:18px}
</style>
</head>
<body>
<div class="card">
  <h1>🎁 اكتشفي جائزتك</h1>
  <p>اضغطي الزر لتكتشفي جائزتك العشوائية ✨</p>

  <button id="reveal" onclick="showPrize()">اكتشفي جائزتي</button>

  <div id="prize"></div>

  <button id="instagram" onclick="location.href='https://www.instagram.com/hiba_shein_order/'">
    تسوّقي الآن على إنستغرام
  </button>

  <div class="small">hiba_shein_order ♡</div>
</div>

<script>
const prizes = [
  "خصم 5% عند الشراء فوق مبلغ معيّن 🎀",
  "اشتري بـ200 شيكل أو أكثر واربحِي هدية باكج 🎁",
  "توصيل مجاني 🚚",
  "قسيمة شرائية 🛍️"
];

function showPrize(){
  const prize = prizes[Math.floor(Math.random() * prizes.length)];
  document.getElementById("prize").textContent = prize;
  document.getElementById("prize").style.display = "block";
  document.getElementById("reveal").style.display = "none";
  document.getElementById("instagram").style.display = "block";
}
</script>
</body>
</html>
